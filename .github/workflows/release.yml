name: Release Obsidian plugin

on:
    push:
        tags:
            - '*'

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
            attestations: write
        steps:
            - uses: actions/checkout@v6

            - uses: pnpm/action-setup@v4

            - name: Use Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: 'pnpm'

            - name: Build plugin
              run: |
                  pnpm install --frozen-lockfile
                  pnpm run build

            - name: Check for optional styles
              id: styles
              run: |
                  [ -f styles.css ] && echo "exists=true" >> "$GITHUB_OUTPUT" || echo "exists=false" >> "$GITHUB_OUTPUT"

            - name: Attest build provenance
              uses: actions/attest@v4
              with:
                  subject-path: |
                      main.js
                      ${{ steps.styles.outputs.exists == 'true' && 'styles.css' || '' }}

            # Published, not drafted. The sample workflow drafts the release, and a
            # draft is invisible to everything that matters: BRAT does not see it,
            # the community directory does not see it, and the CI goes green while
            # nobody can install a thing. It cost a manual `gh release edit
            # --draft=false` after every single release until this line changed.
            #
            # `--notes` is left to be filled in afterwards on purpose: a release
            # note worth reading is written by a person, and an empty one is easier
            # to spot than a generated one nobody meant.
            - name: Create release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  tag="${GITHUB_REF#refs/tags/}"

                  gh release create "$tag" \
                    --title="$tag" \
                    --latest \
                    --notes "" \
                    main.js manifest.json ${{ steps.styles.outputs.exists == 'true' && 'styles.css' || '' }}
