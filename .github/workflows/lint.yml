name: Build and lint

on:
    push:
        branches: ['**']
    pull_request:
        branches: ['**']

jobs:
    build:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                node-version: [22.x, 24.x]
                # Not 20.x: pnpm 11 needs Node >= 22.13, and `pnpm test` runs
                # TypeScript through native type stripping, stable from 22.18.

        steps:
            - uses: actions/checkout@v6
            - uses: pnpm/action-setup@v4
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'pnpm'
            - run: pnpm install --frozen-lockfile
            - run: pnpm run build
            - run: pnpm run lint
            - run: pnpm run test
